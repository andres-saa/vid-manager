<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ video.title }}</title>
    <style>
        :root {
            --bg-body: #0f172a;       /* Slate 900 */
            --surface: #1e293b;       /* Slate 800 */
            --text-main: #f1f5f9;     /* Slate 100 */
            --text-muted: #94a3b8;    /* Slate 400 */
            --primary: #8b5cf6;       /* Violet 500 */
            --radius: 0.3rem;         /* REGLA DE ORO */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Evita scroll si no es necesario */
        }

        .cinema-container {
            width: 95%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.5s ease-out;
        }

        /* Contenedor del video con sombra de cine */
        .video-wrapper {
            background: #000;
            border-radius: var(--radius);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6); /* Sombra difusa tipo cine */
            border: 1px solid #334155;
            position: relative;
            overflow: hidden;
            line-height: 0; /* Elimina espacio extra bajo el video */
        }

        video {
            width: 100%;
            height: auto;
            max-height: 80vh; /* Para que no se salga de la pantalla verticalmente */
            border-radius: var(--radius);
            outline: none;
            display: block;
        }

        /* Título minimalista debajo */
        .video-info {
            text-align: center;
            opacity: 0; /* Se oculta inicialmente */
            animation: slideUp 0.8s ease-out 0.5s forwards; /* Aparece después */
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-muted);
            margin: 0;
            letter-spacing: 0.05rem;
        }

        /* Animaciones suaves */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar por si acaso */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--surface); border-radius: var(--radius); }
    </style>
</head>
<body>

    <div class="cinema-container">
        <div class="video-wrapper">
            <video controls autoplay>
                <source src="/static_videos/{{ video.filename }}" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
        </div>

        <div class="video-info">
            <h1>{{ video.title }}</h1>
        </div>
    </div>

</body>
</html>
